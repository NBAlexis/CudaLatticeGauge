# TestHeatbath — Z2+Z3+D3+D4 gauge fields with 4 different betas
TestHeatbath:

    Dim : 4
    Dir : 4
    LatticeLength : [8, 8, 8, 8]
    LatticeIndex : CIndexSquare
    LatticeBoundary : CBoundaryConditionTorusSquare
    ThreadAutoDecompose : 1
    RandomType : ER_Schrage
    RandomSeed : 1234567
    ActionListLength : 4
    MeasureListLength : 4
    GaugeFieldCount : 4

    EquilSteps : 5
    EquilStepsD : 5
    MeasureSteps : 10
    MeasureStepsD : 10

    ExpectedRes : [0.010807, -0.003613, -0.000195, -0.002279]
    ExpectedResDebug : [0.010807, -0.003613, -0.000195, -0.002279]

    Updator:
        UpdatorType : CHeatbath

    Gauge:
        FieldName : CFieldGaugeZ2
        FieldInitialType : EFIT_Random
        FieldId : 1

    Gauge2:
        FieldName : CFieldGaugeZ3
        FieldInitialType : EFIT_Random
        FieldId : 2

    Gauge3:
        FieldName : CFieldGaugeD3
        FieldInitialType : EFIT_Random
        FieldId : 3

    Gauge4:
        FieldName : CFieldGaugeD4
        FieldInitialType : EFIT_Random
        FieldId : 4

    Action1:
        ActionName : CActionDiscreteZNPlaquette
        Beta : 0.5
        GaugeFields : [1]

    Action2:
        ActionName : CActionDiscreteZNPlaquette
        Beta : 1.0
        GaugeFields : [2]

    Action3:
        ActionName : CActionDiscreteDNPlaquette
        Beta : 1.5
        GaugeFields : [3]

    Action4:
        ActionName : CActionDiscreteDNPlaquette
        Beta : 2.0
        GaugeFields : [4]

    Measure1:
        MeasureName : CMeasurePlaqutteEnergy
        GaugeFields : [1]

    Measure2:
        MeasureName : CMeasurePlaqutteEnergy
        GaugeFields : [2]

    Measure3:
        MeasureName : CMeasurePlaqutteEnergy
        GaugeFields : [3]

    Measure4:
        MeasureName : CMeasurePlaqutteEnergy
        GaugeFields : [4]

# TestUpdatorLeapFrog
