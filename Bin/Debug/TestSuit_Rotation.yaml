        SolverName : CSLASolverGMRES
        SolverForFieldId : 2
        MaxDim : 20
        Accuracy : 0.0001
        Restart : 15
        AbsoluteAccuracy : 1

    MSSolver:

        # SolverName : CMultiShiftBiCGStab
        # SolverForFieldId : 2
        # DiviationStep : 100
        # MaxStep : 50
        # Accuracy : 0.00001
        # AbsoluteAccuracy : 1

        SolverName : CMultiShiftFOM
        SolverForFieldId : 2
        UseCudaForSmallMatrix : 0
        MaxDim : 30
        Accuracy : 0.0001
        Restart : 100
        AbsoluteAccuracy : 1

    Action1:
   
        # ActionName : CActionGaugePlaquette
        ActionName : CActionGaugePlaquetteRotating
        CloverEnergy : 0
        Beta : 4.5
        Omega : 0.2

    Action2:

        ActionName : CActionFermionKS
        FieldId : 2

    Measure1:

        MeasureName : CMeasurePlaqutteEnergy

