    BeforeMetropolis : 5
    BeforeMetropolisDebug : 1
    Metropolis : 10
    MetropolisDebug : 4
    ExpectMiss : 1
    ExpectMissDebug : 1
    ExpectedRes : [0.546028]
    ExpectedResDebug : [0.413]

    Updator:

        UpdatorType : CHMC
        Metropolis : 1
        DebugForce : 1
        InnerLeapfrog : 1
        # IntegratorType : CIntegratorForceGradient
        # IntegratorType : CIntegratorOmelyan
