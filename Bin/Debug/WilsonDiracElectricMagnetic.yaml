Job : Electric

# configurations of Nf2 is for matching
Nf2:

    VerboseLevel : GENERAL
    # VerboseLevel : DETAILED
    # VerboseLevel : PARANOIAC
    VerboseOutput : datetime
    Dim : 4
    Dir : 4
    LatticeLength : [24, 24, 24, 48]
    LatticeIndex : CIndexSquare
    LatticeBoundary : CBoundaryConditionTorusSquare
    ThreadAutoDecompose : 1
    RandomType : ER_XORWOW
    RandomSeed : ERST_Timestamp
    ActionListLength : 2
    GaugeFieldCount : 1
    FermionFieldCount : 2
    MeasureListLength : 1
    CacheSolution : 0
    MaxThreadPerBlock : 128
    ExponentialPrecision : 1
    Profiler : 1
    Warmup : 5
    ConfigurationNumber : 100
    FileName : Nf2p1

    Updator:

        UpdatorType : CHMC
        Metropolis : 1
        Skip : 5
        IntegratorType : CIntegratorNestedForceGradient
        # IntegratorType : CIntegratorForceGradient
        IntegratorStepLength : 1
        IntegratorStep : 18
        IntegratorStepWarmup : 5
        NestedStep : 6
        DebugForce : 0

    Gauge:
    
        FieldName : CFieldGaugeSU3TreeImproved
        # FieldName : CFieldGaugeSU3
        FieldInitialType : EFIT_Random
        RectOverPlaq : -0.05
        
    FermionField1:
        
        FieldName : CFieldFermionWilsonSquareCloverSU3
        # FieldName : CFieldFermionWilsonSquareSU3

        FieldInitialType : EFIT_RandomGaussian
        Hopping : 0.14
        Csw : 1.0
        FieldId : 2
        PoolNumber : 26
        Period : [1, 1, 1, -1]

    FermionField2:
        
        FieldName : CFieldFermionWilsonSquareCloverSU3

        FieldInitialType : EFIT_RandomGaussian
        Hopping : 0.14
        Csw : 1.0
        FieldId : 3
        PoolNumber : 26
        Period : [1, 1, 1, -1]

        Rational : ER_AllRational
        # 1/4, for Nf=1
        MC : [1.5312801946347594, -0.0009470074905847408, -0.022930177968879067, -1.1924853242121976, 0.005144532232063027, 0.07551561111396377, 1.3387944865990085]
        # -1/2, for Nf=1
        MD : [0.39046039002765764, 0.05110937758016059, 0.14082862345293307, 0.5964845035452038, 0.0012779192856479133, 0.028616544606685487, 0.41059997211142607]

    Solver:

        SolverName : CSLASolverGMRES
        SolverForFieldId : 2
        MaxDim : 20
        Accuracy : 0.0000001
        Restart : 500
        AbsoluteAccuracy : 1

    Solver2:

        SolverName : CSLASolverGMRES
        SolverForFieldId : 3
        MaxDim : 20
        Accuracy : 0.0000001
        Restart : 500
        AbsoluteAccuracy : 1

    MSSolver:

        SolverName : CMultiShiftBiCGStab
        SolverForFieldId : 2
        DiviationStep : 10
        ## after MaxStep checks (DiviationStep x MaxStep steps) if the Accuracy is not reached, give up
        MaxStep : 500
        ## Can NOT be too small, otherwise, will never reached..
        Accuracy : 0.0001
        AbsoluteAccuracy : 1

    MSSolver2:

        SolverName : CMultiShiftBiCGStab
        SolverForFieldId : 3
        DiviationStep : 10
        ## after MaxStep checks (DiviationStep x MaxStep steps) if the Accuracy is not reached, give up
        MaxStep : 500
        ## Can NOT be too small, otherwise, will never reached..
        Accuracy : 0.0001
        AbsoluteAccuracy : 1

    Action1:
   
        ActionName : CActionGaugePlaquette
        Beta : 7.0

    Action2:

        ActionName : CActionFermionKSImproveCombined
        FieldIds : [2, 3]

    Measure1:

        MeasureName : CMeasurePlaqutteEnergy

    GaugeSmearing:

        SmearingName : CGaugeSmearingStoutSU3
        # SmearingName : CGaugeSmearingASQTADSU3
        Iterate : 1
        # HasT : 1
        FieldId : 1
        Update : 1
        # rhojk : 0.25
        # rho4mu : 0.2
        rho : 0.2

