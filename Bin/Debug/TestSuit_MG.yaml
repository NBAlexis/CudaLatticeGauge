#=============================================================================
# TestSuit_MG.yaml
#
# Multi-GPU test suite. Every test here is a decomposition-consistency test:
# run the SAME test under `./CLGTest MG` (single process, identity
# decomposition) and under `runtest.sh <Name> <GpuCount>` (mpiexec -n N with
# per-rank GPU binding), and compare the printed scalars / MD5s / error counts.
#
# Driver metadata (Improve-1 I10): each block declares its decomposed run via
#   MultiGPUTestRankCount : N
#   MultiGPUTestGrid : [gx, gy, gz, gt]   (product must equal N)
# These keys are consumed ONLY by the test driver (runtest.sh --mg-config,
# which injects --gpu-grid / --device-per-node on the mpiexec command line);
# the library never reads them. Blocks no longer carry GpuGrid/DevicePerNode.
#
# Loading: CLGTest.cpp LoadParams parses TestSuit_MG.yaml after
# TestSuit_FileIO.yaml; the test list is built from paramName presence, so the
# split does not change any test's parameters -- only the category grouping
# (`./CLGTest MG` runs exactly this suite).
#=============================================================================

TestMGGatherScatterRoundTrip:

    Dim : 4
    Dir : 4
    LatticeLength : [8, 8, 8, 8]
    LatticeIndex : CIndexSquare
    LatticeBoundary : CBoundaryConditionTorusSquare
    RandomType : ER_Schrage
    RandomSeed : 1234567
    ActionListLength : 0
    FermionFieldCount : 0
    MeasureListLength : 0

    ## Multi-GPU gather/scatter round-trip. Ignored by single-GPU build.
    ## Grid product MUST equal mpiexec -n N, so the committed default is [1,1,1,1]
    ## (single-process safe; passes in the default -n1 suite). For the -n2

    Gauge:
        ## FieldType = {CFieldGaugeSU3}
        FieldName : CFieldGaugeSU3
        ## Overwritten by InitialFieldWithFile in the test; value here is a placeholder.
        FieldInitialType : EFIT_Identity

    MultiGPUTestRankCount : 4
    MultiGPUTestGrid : [2, 1, 1, 2]
