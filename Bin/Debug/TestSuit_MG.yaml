    ## Multi-GPU Phase 4 (P5-1.1): cross-precision gauge load 1-vs-N.
    ## Saves an EFIT_Random config as a DOUBLE file, reloads it via
    ## EFFT_CLGBinDouble (float build: cross-precision), prints the Dot.
    ## Decomposed via runtest.sh (metadata grid below).

    Gauge:
        FieldName : CFieldGaugeSU3
        ## Overwritten by InitialField(EFIT_Random) in the test; placeholder.
        FieldInitialType : EFIT_Identity
        Period : [1, 1, 1, 1]

    GaugeBoundary:
        FieldName : CFieldBoundaryGaugeSU3

    Action1:
        ActionName : CActionGaugePlaquette
        Beta : 5.35

    MultiGPUTestRankCount : 2
    MultiGPUTestGrid : [1, 1, 1, 2]
TestMGArrayReduce:

    Dim : 4
    Dir : 4
    LatticeLength : [8, 8, 8, 8]
    LatticeIndex : CIndexSquare
    LatticeBoundary : CBoundaryConditionTorusSquare
    ThreadAutoDecompose : 1
    RandomType : ER_XORWOW
    RandomSeed : 1234567
    ActionListLength : 1
    FermionFieldCount : 0
    MeasureListLength : 0
    CacheStaple : 0

    ## Multi-GPU Phase 4 (P4-3.5): array (profile) reduction 1-vs-N unit test.
    ## x must be un-split (same index set per rank) so the per-rank partials
    ## can be summed element-wise: the decomposed grid below splits z only.
    ## Compare the printed total for -n1 vs -nN (DOUBLE tol).

    Gauge:
        FieldName : CFieldGaugeSU3
        FieldInitialType : EFIT_Identity
        Period : [1, 1, 1, 1]

    GaugeBoundary:
        FieldName : CFieldBoundaryGaugeSU3

    Action1:
        ActionName : CActionGaugePlaquette
        Beta : 5.35




