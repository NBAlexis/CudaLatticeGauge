TestMGWilsonDConsistency:

    Dim : 4
    Dir : 4
    LatticeLength : [8, 8, 8, 8]
    LatticeIndex : CIndexSquare
    LatticeBoundary : CBoundaryConditionTorusSquare
    RandomType : ER_Schrage
    RandomSeed : 1234567
    ActionListLength : 0
    FermionFieldCount : 1
    MeasureListLength : 0

    ## Multi-GPU fermion stencil (Wilson D): load testGaugeSingle.con_, apply Wilson
    ## D twice to a uniform identity spinor (boundary sites read neighbour gauge links
    ## and neighbour spinor sites = exercises both halos), gather result to rank 0,
    ## print MD5. Identical MD5 for -n1 vs -nN proves the fermion stencil halo reads
    ## are correct. Decomposed via runtest.sh (metadata grid below).

    ## How many times to apply D (bisection of the two halo paths). 1 = gauge halo
    ## only (uniform input); 2 = also stress the input-spinor halo.
    DApplyCount : 2

    Gauge:
        FieldName : CFieldGaugeSU3
        ## Overwritten by InitialFieldWithFile in the test; placeholder.
        FieldInitialType : EFIT_Identity

    FermionField1:
        FieldName : CFieldFermionWilsonSquareSU3
        ## Overwritten by InitialField(EFIT_Identity) in the test.
        FieldInitialType : EFIT_RandomGaussian
        Hopping : 0.1355
        FieldId : 2
        PoolNumber : 2

    MultiGPUTestRankCount : 2
    MultiGPUTestGrid : [1, 1, 1, 2]
TestMGFermionSaveLoad:

    Dim : 4
    Dir : 4
    LatticeLength : [8, 8, 8, 8]
    LatticeIndex : CIndexSquare
    LatticeBoundary : CBoundaryConditionTorusSquare
    RandomType : ER_XORWOW
    RandomSeed : 1234567
    ActionListLength : 0
    FermionFieldCount : 1
    MeasureListLength : 0

    ## Multi-GPU P5-1.2 fermion save/load round-trip: random Gaussian spinor
    ## (global-seeded, identical on -n1 vs -nN) -> save (global gather) -> reload
    ## through the scatter-aware fermion loader -> save again. Same MD5 proves
    ## the round-trip is lossless on every rank; the driver compares -n1 vs -nN.
    ## Previously each rank read the file by its LOCAL site count (silent wrong);
    ## a cold/identity spinor would be scatter-invariant and blind to it.
    ## Decomposed runs go through runtest.sh (metadata grid below).

    Gauge:
        FieldName : CFieldGaugeSU3
        ## Placeholder; the test only saves/loads the fermion field.
        FieldInitialType : EFIT_Identity

    FermionField1:
        FieldName : CFieldFermionWilsonSquareSU3
        ## Overwritten by InitialField(EFIT_RandomGaussian) in the test.
        FieldInitialType : EFIT_RandomGaussian
        Hopping : 0.1355
        FieldId : 2
        PoolNumber : 2

    MultiGPUTestRankCount : 2
    MultiGPUTestGrid : [1, 1, 1, 2]
TestMGStaggeredDConsistency:

    Dim : 4
    Dir : 4
    LatticeLength : [8, 8, 8, 8]
    LatticeIndex : CIndexSquare
    LatticeBoundary : CBoundaryConditionTorusSquare
    RandomType : ER_Schrage
    RandomSeed : 1234567
    ActionListLength : 0
    FermionFieldCount : 1
    MeasureListLength : 0
    ## KS fermion bakes the Naik 3-hop table at init; on a decomposed lattice
    ## HaloWidth must be >= 3 or the config check fails fast (I8).
    HaloWidth : 3

    ## Multi-GPU fermion stencil (plain staggered KS D): load testGaugeSingle.con_,
    ## apply staggered D twice to a uniform identity spinor (boundary sites read
    ## neighbour gauge links and neighbour spinor sites = exercises both halos),
    ## gather result to rank 0, print MD5. Identical MD5 for -n1 vs -nN proves the
    ## staggered fermion stencil halo reads are correct. The decomposed run grid is
    ## declared via MultiGPUTestRankCount / MultiGPUTestGrid below (driver metadata,
    ## consumed by runtest.sh --mg-config, not by the library).

    ## How many times to apply D (bisection of the two halo paths). 1 = gauge halo
    ## only (uniform input); 2 = also stress the input-spinor halo.
    DApplyCount : 2

    Gauge:
        FieldName : CFieldGaugeSU3
        ## Overwritten by InitialFieldWithFile in the test; placeholder.
        FieldInitialType : EFIT_Identity

    FermionField1:
        FieldName : CFieldFermionKSSU3
        ## Overwritten by InitialField(EFIT_Identity) in the test.
        FieldInitialType : EFIT_RandomGaussian
        ## 2am
        Mass : 0.2
        FieldId : 2
        PoolNumber : 2

    MultiGPUTestRankCount : 2
    MultiGPUTestGrid : [1, 1, 1, 2]
TestMGHISQDConsistency:

    Dim : 4
    Dir : 4
    LatticeLength : [8, 8, 8, 8]
    LatticeIndex : CIndexSquare
    LatticeBoundary : CBoundaryConditionTorusSquare
    RandomType : ER_Schrage
    RandomSeed : 1234567
    MILC_StaggeredPhase : 1
    ActionListLength : 0
    FermionFieldCount : 1
    MeasureListLength : 0
    CacheStaple : 0

    ## Multi-GPU HISQ/Naik fermion stencil (widest: Naik reads a 3-hop neighbour).
    ## Loads testGaugeSingle.con_, triggers the HISQ smearing (fat + Naik links), then
    ## applies HISQ D twice to a uniform identity spinor and gathers the result to rank
    ## 0. Identical MD5 for -n1 vs -nN proves the HISQ width-3 halo reads (Naik link +
    ## fat link + input spinor) AND the halo-aware smearing build are all correct.
    ## Decomposed runs go through runtest.sh (metadata grid below). The Naik 3-link
    ## path needs
    ## a 3-wide halo, so HaloWidth MUST be >= 3 (this overrides the default of 2).
    HaloWidth : 3

    ## 1 = gauge/Naik halo only (uniform input); 2 = also stress the input-spinor halo.
    DApplyCount : 2

    Gauge:
        FieldName : CFieldGaugeSU3
        ## Overwritten by InitialFieldWithFile in the test; placeholder.
        FieldInitialType : EFIT_Identity

    GaugeBoundary:
        FieldName : CFieldBoundaryGaugeSU3

    FermionField1:
        FieldName : CFieldFermionHISQSU3
        ## Overwritten by InitialField(EFIT_Identity) in the test.
        FieldInitialType : EFIT_Zero
        Mass : 0.22
        ## Plain HISQ: Epsilon 0 (no L1-effective eps term), only the Naik 3-link term.
        Epsilon : 0.0
        Naik : -0.03708333333333333
        FieldId : 2
        PoolNumber : 4
        Period : [1, 1, 1, -1]

    ## HISQ two-level smearing that builds the fat + Naik links the D operator reads.
    GaugeSmearing:
        SmearingName : CGaugeSmearingHISQSU3
        Iterate : 1
        HasT : 1
        FieldId : 1
        Update : 1
        Proj : 1
        ProjSUN : 0
        UseCaylayHamilton : 1

    MultiGPUTestRankCount : 2
    MultiGPUTestGrid : [1, 1, 1, 2]
TestMGReductionConsistency:

    Dim : 4
    Dir : 4
    LatticeLength : [8, 8, 8, 8]
    LatticeIndex : CIndexSquare
    LatticeBoundary : CBoundaryConditionTorusSquare
    RandomType : ER_Schrage
    RandomSeed : 1234567
    MILC_StaggeredPhase : 1
    ActionListLength : 0
    FermionFieldCount : 1
    MeasureListLength : 0
    CacheStaple : 0
    ## KS fermion bakes the Naik 3-hop table at init; on a decomposed lattice
    ## HaloWidth must be >= 3 or the config check fails fast (I8).
    HaloWidth : 3

    ## Multi-GPU Phase 3 global-reduction consistency. Loads testGaugeSingle.con_,
    ## computes gauge Dot (real global sum) and, after applying staggered D twice to a
    ## uniform identity spinor, fermion Dot (complex global sum). The printed scalars
    ## must match -n1 vs -nN to DOUBLE tolerance (NOT bitwise: MPI sum-tree order
    ## differs). Missing Allreduce would give ~1/N of the -n1 value.
    ## Decomposed runs go through runtest.sh (metadata grid below).
    DApplyCount : 2

    Gauge:
        FieldName : CFieldGaugeSU3
        FieldInitialType : EFIT_Identity

    GaugeBoundary:
        FieldName : CFieldBoundaryGaugeSU3

    FermionField1:
        FieldName : CFieldFermionKSSU3
        FieldInitialType : EFIT_Zero
        Mass : 0.22
        FieldId : 2
        PoolNumber : 4
        Period : [1, 1, 1, -1]

    MultiGPUTestRankCount : 2
    MultiGPUTestGrid : [1, 1, 1, 2]
TestMGRngGlobalSeed:

    Dim : 4
    Dir : 4
    LatticeLength : [8, 8, 8, 8]
    LatticeIndex : CIndexSquare
    LatticeBoundary : CBoundaryConditionTorusSquare
    ## Seedable, decomposition-invariant generator (Sobol variants use per-local-index
    ## direction vectors and CANNOT be made rank-invariant). Fixed seed for repro.
    RandomType : ER_XORWOW
    RandomSeed : 1234567
    MILC_StaggeredPhase : 1
    ActionListLength : 0
    FermionFieldCount : 1
    MeasureListLength : 0
    CacheStaple : 0
    ## KS fermion bakes the Naik 3-hop table at init; on a decomposed lattice
    ## HaloWidth must be >= 3 or the config check fails fast (I8).
    HaloWidth : 3

    ## Multi-GPU Phase 3 RNG global-coordinate seeding. Fills fermion id 2 with per-site
    ## Gaussians (the HMC momentum-refresh primitive) and gathers to rank 0. Identical
    ## MD5 for -n1 vs -nN proves each global site draws the same curand stream regardless
    ## of decomposition. Decomposed runs go through runtest.sh.

    Gauge:
        FieldName : CFieldGaugeSU3
        FieldInitialType : EFIT_Identity

    GaugeBoundary:
        FieldName : CFieldBoundaryGaugeSU3

    FermionField1:
        FieldName : CFieldFermionKSSU3
        FieldInitialType : EFIT_Zero
        Mass : 0.22
        FieldId : 2
        PoolNumber : 4
        Period : [1, 1, 1, -1]

    MultiGPUTestRankCount : 2
    MultiGPUTestGrid : [1, 1, 1, 2]
