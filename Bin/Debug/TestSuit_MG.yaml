TestMGHmcHISQConsistency:

    Dim : 4
    Dir : 4
    LatticeLength : [8, 8, 8, 8]
    LatticeIndex : CIndexSquare
    LatticeBoundary : CBoundaryConditionTorusSquare
    ThreadAutoDecompose : 1
    ## Seedable, decomposition-invariant generator so momentum refresh AND the
    ## pseudofermion heatbath draw identical per-site Gaussians on -n1 vs -nN.
    ## Fixed seed for repro.
    RandomType : ER_XORWOW
    RandomSeed : 1234567
    MILC_StaggeredPhase : 1
    ActionListLength : 2
    FermionFieldCount : 1
    MeasureListLength : 0
    CacheStaple : 0
    ExponentialPrecision : 0
    GaugeMomentumFactor : 2.0

    ## Multi-GPU Phase 3 (P3-9.1) end-to-end HISQ-fermion HMC 1-vs-N. Loads
    ## testGaugeSingle.con_, runs TrajCount short trajectories of a HISQ
    ## pseudofermion (rational multi-shift) + plaquette-gauge HMC. Fermion setup
    ## mirrors TestFermionUpdatorHISQNoEvenOdd; EvenOdd is OFF because the MG
    ## Naik width-3 halo refill lives in the non-even-odd D path only.
    ## Compare for -n1 vs -nN: accept/reject sequence + acceptCount (EXACT --
    ## Metropolis rand is broadcast, H is globally reduced), rmsHDiff and final
    ## plaquette energy (DOUBLE tol). Decomposed runs go through runtest.sh
    ## (metadata grid below). The Naik 3-link path needs HaloWidth >= 3.
    HaloWidth : 3
    TrajCount : 4

    Updator:
        UpdatorType : CHMC
        Metropolis : 1
        IntegratorType : CIntegratorLeapFrog
        ## Short trajectory (~10 MD steps). Small dt keeps dH moderate so both
        ## Metropolis branches are exercised on the loaded near-cold config.
        IntegratorStepLength : 0.1
        IntegratorStep : 10

    Gauge:
        FieldName : CFieldGaugeSU3
        ## Overwritten by InitialFieldWithFile in the test; placeholder.
        FieldInitialType : EFIT_Identity

    GaugeBoundary:
        FieldName : CFieldBoundaryGaugeSU3

    FermionField1:
        FieldName : CFieldFermionHISQSU3
        FieldInitialType : EFIT_RandomGaussian
        Mass : 0.3
        FieldId : 2
        PoolNumber : 15
        ## 0 = no even-odd preconditioning (see header comment).
        Even : 0
        Epsilon : -0.1
        Period : [1, 1, 1, -1]
        MC : [1.5312801946347594, -0.0009470074905847408, -0.022930177968879067, -1.1924853242121976, 0.005144532232063027, 0.07551561111396377, 1.3387944865990085]
        MD : [0.39046039002765764, 0.05110937758016059, 0.14082862345293307, 0.5964845035452038, 0.0012779192856479133, 0.028616544606685487, 0.41059997211142607]

    Solver:
        SolverName : CSLASolverGMRES
        SolverForFieldId : 2
        MaxDim : 20
        Accuracy : 0.0001
        Restart : 15
        AbsoluteAccuracy : 1

    MSSolver:
        SolverName : CMultiShiftBiCGStab
        SolverForFieldId : 2
        DiviationStep : 10
        MaxStep : 200
        Accuracy : 0.000000001
        AbsoluteAccuracy : 1

    Action1:
        ActionName : CActionGaugePlaquette
        Beta : 5.0

    Action2:
        ActionName : CActionFermionKSImprove
        FieldId : 2
        HISQ : 1

    ## HISQ two-level smearing that builds the fat + Naik links; refires on every
    ## gauge change (Update : 1) during the MD evolution.
    GaugeSmearing:
        SmearingName : CGaugeSmearingHISQSU3
        FieldId : 1
        Update : 1
        ProjSUN : 0
        Proj : 1
        UseCaylayHamilton : 1

    MultiGPUTestRankCount : 2
    MultiGPUTestGrid : [1, 1, 1, 2]



