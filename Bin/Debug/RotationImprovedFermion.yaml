    # c   quark: 1 field,  MC: 1/8 MD: -1/4
    # x   quark: 3 field,  MC: 1/8 MD: -1/4
    # uds quark: 1 field,  MC: (Al^2As/Ax^3)^{1/8}  (Al^2As/Ax^3)^{-1/4}
    #
    # for rational approximation, we use precision ~ 1.0e-10
