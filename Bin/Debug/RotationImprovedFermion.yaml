    # Fermions: D^{1/4} => A=D^+D => A^{1/8} using even pseudo fermion: A^{1/4}
    # 
    # Al^{1/2} As^{1/4} Ac^{1/4}
    # Note: when we have epsilon for c quark, D0 of c is not as same as u,d,s, so we can only use u,d,s quark mass precondition
    # (Al^2As/Ax^3)^{1/4} Ax^{1/4} Ax^{1/4} Ax^{1/4} Ac^{1/4}
    # where Ax is the mass preconditioner, with am = 0.2
    #
    # A = D^2 + 4m^2
    # MC white noise:  (Al^2As/Ax^3)^{1/8}  (As)^{1/8} (As)^{1/8} (As)^{1/8} (Ac)^{1/8}
    # MD dynamic:      (Al^2As/Ax^3)^{-1/4} (As)^{-1/4} (As)^{-1/4} (As)^{-1/4} (Ac)^{-1/4}
