
# HMC diagnostic suite (HMCDiagnosticsRevise-v3.md)
# Each block runs two diagnostics:
#   1. MD reversibility (RunReversibility)
#   2. Finite-difference force validation per continuous action (RunFiniteDiff)
#
# ActionIndices is optional.  Omit it to test every continuous action.

TestHmcDiagnostics_SU3Gauge_KS:

    Dim : 4
    Dir : 4
    LatticeLength : [4, 4, 4, 4]
    LatticeIndex : CIndexSquare
    LatticeBoundary : CBoundaryConditionTorusSquare
    ThreadAutoDecompose : 1
    RandomType : ER_Schrage
    RandomSeed : 1234567
    ExponentialPrecision : 4
    ActionListLength : 2
    MeasureListLength : 0
