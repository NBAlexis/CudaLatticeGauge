        ActionName : CActionGaugePlaquetteAcceleration
        Beta : 3
        Omega : 0.2
        AccG : 0.1

    Action2:

        ActionName : CActionFermionKS
        FieldId : 2

    Measure1:

        MeasureName : CMeasurePlaqutteEnergy

